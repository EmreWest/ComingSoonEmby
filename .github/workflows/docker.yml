name: Build and publish

# main -> ghcr.io/<owner>/<repo>:latest, tag v1.2.3 -> :1.2.3 and :1.2 plus a GitHub release with
# the DLL. Pull requests only build.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release on tags
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The final stage only copies files, so the foreign platforms need no QEMU.
      - name: Build and push installer image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export plugin DLL
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dll
          outputs: type=local,dest=out
          cache-from: type=gha

      - uses: actions/upload-artifact@v4
        with:
          name: ComingSoonPlugin
          path: out/ComingSoonPlugin.dll

      - name: Attach DLL to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ComingSoonPlugin.dll
          generate_release_notes: true
